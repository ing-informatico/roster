services:
  db:
    image: postgres:16
    container_name: roster_db
    environment:
      POSTGRES_DB: roster
      POSTGRES_USER: roster_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5544:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - roster_net

volumes:
  db_data:

networks:
  roster_net:
